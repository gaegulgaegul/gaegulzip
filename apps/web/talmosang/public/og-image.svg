<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- 크림색 배경 -->
  <rect width="1200" height="630" fill="#FFF8F0"/>
  
  <!-- 노이즈 텍스처 -->
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"/>
  </filter>
  <rect width="1200" height="630" filter="url(#noise)" opacity="0.05"/>
  
  <!-- 메인 타이틀 -->
  <text x="600" y="280" font-family="sans-serif" font-size="120" font-weight="bold" fill="#2D2D2D" text-anchor="middle">
    탈모상
  </text>
  
  <!-- 서브타이틀 -->
  <text x="600" y="360" font-family="sans-serif" font-size="36" fill="#2D2D2D" text-anchor="middle" opacity="0.8">
    내가 탈모가 될 상인가?
  </text>
  
  <!-- 설명 -->
  <text x="600" y="440" font-family="sans-serif" font-size="28" fill="#2D2D2D" text-anchor="middle" opacity="0.7">
    AI 관상가가 그대의 모발 운명을 점지하리라
  </text>
  
  <!-- 장식 원 -->
  <circle cx="200" cy="150" r="40" fill="none" stroke="#E85D4A" stroke-width="3" stroke-dasharray="5,5"/>
  <circle cx="1000" cy="480" r="50" fill="none" stroke="#F2A541" stroke-width="3" stroke-dasharray="5,5"/>
</svg>
